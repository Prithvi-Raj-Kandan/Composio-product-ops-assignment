name: research-one

# Research one new company by name or URL with the full verified pipeline,
# append it to data/results.json, recompute patterns, and redeploy the page.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Company name or docs URL, e.g. Notion or https://developers.notion.com"
        required: true
      append:
        description: "Append the result to data/results.json and redeploy"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Research
        run: |
          if [ "${{ inputs.append }}" = "true" ]; then
            python -m opsresearch research-one "$TARGET" --append | tee research_output.txt
          else
            python -m opsresearch research-one "$TARGET" | tee research_output.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: research_output.txt
      - name: Recompute patterns and commit
        if: ${{ inputs.append }}
        run: |
          python -m opsresearch patterns
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/results.csv data/patterns.json data/runs
          git commit -m "research-one: $TARGET" || echo "nothing to commit"
          git push
  deploy:
    needs: research
    if: ${{ inputs.append }}
    uses: ./.github/workflows/pages.yml
